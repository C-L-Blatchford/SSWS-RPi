name: Snowdon Data Analysis

on:
  push:
    branches:
      - main

jobs:
  analyse:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      
    steps:

    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        pip install pandas matplotlib

    - name: Run analysis
      run: |
        python analyse.py

    - name: Upload plots
      run: |
        git config user.name "github-actions"
        git config user.email "github-actions@github.com"

        git add daily_summary.png

        git diff --staged --quiet || git commit -m "Update daily summary"

        git push
